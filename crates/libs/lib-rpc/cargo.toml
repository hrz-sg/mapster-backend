[package]
name = "lib-rpc"
version = "0.1.0"
edition = "2024"

[dependencies]
# -- App Libs
lib-core = { path = "../../libs/lib-core" }
# -- Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# -- Json
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { workspace = true }
# -- Others
derive_more = { workspace = true }
modql = { workspace = true }